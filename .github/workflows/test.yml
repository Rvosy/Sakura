name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Runtime v2 frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run Runtime v2 frontend tests
        working-directory: desktop/frontend
        run: node --test tests/*.test.js

  unit:
    name: Unit tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        timeout-minutes: 8
        run: python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt

      - name: Run unit tests
        timeout-minutes: 6
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/unit
          -q --tb=short --strict-markers -p no:warnings
          --timeout=60 --timeout-method=thread --durations=20
