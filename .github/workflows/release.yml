name: Release Runtime v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '测试签名仅上传测试产物；publish 发布正式版本'
        type: choice
        options: [test-signing, diagnostic-signing, diagnostic-token-check, publish]
        default: test-signing
        required: true

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
  SIGNPATH_ORGANIZATION_ID: 4071764e-c1ca-4688-9f22-3bf5d059e005
  SIGNPATH_PROJECT_SLUG: Sakura

jobs:
  # Temporary connector diagnosis only: reuses a known unsigned binary, not a
  # fresh source build and not evidence for production signing approval.
  diagnostic-signing:
    if: startsWith(inputs.mode, 'diagnostic-') && github.ref == 'refs/heads/feat/signpath-signing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check credential formatting without revealing credential material
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTOKEN'
          import json, os
          token = os.environ.get("SIGNPATH_TOKEN", "")
          checks = {
              "empty": not bool(token),
              "has_outer_whitespace": token != token.strip(),
              "has_any_whitespace": any(c.isspace() for c in token),
              "contains_xml_markup": "<" in token or ">" in token,
          }
          print(json.dumps(checks, sort_keys=True))
          if any(checks.values()):
              raise SystemExit("Credential formatting check failed; no signing request submitted.")
          PYTOKEN

      - name: Verify and retrieve the previously built unsigned artifact
        if: inputs.mode == 'diagnostic-signing'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Rvosy/Sakura/actions/artifacts/12259301149 > artifact.json
          python3 - <<'PY'
          import json
          a = json.load(open("artifact.json"))
          assert a["id"] == 12259301149 and not a["expired"]
          assert a["name"] == "unsigned-windows-app"
          assert a["workflow_run"]["id"] == 39407831834
          assert a["workflow_run"]["head_sha"] == "b8ec03ea94d4212572f432c5e34a1c24f5ae0ba1"
          assert a["workflow_run"]["head_branch"] == "feat/signpath-signing"
          assert a["digest"] == "sha256:bd89e2ab147a26954e4d3de5684a788bae4554037a890c19cee83be18e70cdb8"
          PY
          gh api repos/Rvosy/Sakura/actions/artifacts/12259301149/zip > source.zip
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          assert hashlib.sha256(pathlib.Path("source.zip").read_bytes()).hexdigest() == "bd89e2ab147a26954e4d3de5684a788bae4554037a890c19cee83be18e70cdb8"
          with zipfile.ZipFile("source.zip") as z:
              assert z.namelist() == ["sakura.exe"], "Unexpected artifact contents"
              assert z.getinfo("sakura.exe").file_size < 150_000_000
              pathlib.Path("diagnostic-input").mkdir()
              pathlib.Path("diagnostic-input/sakura.exe").write_bytes(z.read("sakura.exe"))
          PY
          {
            echo 'TEST ONLY: connector diagnostic, not a fresh source build.'
            echo 'Reused unsigned sakura.exe from run 39407831834, artifact 12259301149.'
            echo 'Original source: b8ec03ea94d4212572f432c5e34a1c24f5ae0ba1; version 1.3.6.'
            echo 'The original ZIP digest was checked before extraction. The binary is not executed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reused binary under this diagnostic run
        if: inputs.mode == 'diagnostic-signing'
        id: diagnostic-artifact
        uses: actions/upload-artifact@v7
        with:
          name: TEST-ONLY-reused-unsigned-windows-app
          path: diagnostic-input/sakura.exe
          if-no-files-found: error
          retention-days: 7

      - name: Retrieve the pinned official SignPath action
        if: inputs.mode == 'diagnostic-signing'
        uses: actions/checkout@v6
        with:
          repository: SignPath/github-action-submit-signing-request
          ref: f6d04783b4569d051e0c80105fe66e82819d0092
          path: signpath-action
          persist-credentials: false

      - name: Expose only the official action HTTP response status messages
        if: inputs.mode == 'diagnostic-signing'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("signpath-action/index.js")
          s = p.read_text()
          needle = 'core.debug(`Received response:'
          assert s.count(needle) == 2, "Official action logging changed; stop for review"
          p.write_text(s.replace(needle, 'core.info(`Received response:'))
          PY

      - name: Diagnose the existing connector with the test policy only
        if: inputs.mode == 'diagnostic-signing'
        uses: ./signpath-action
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Sakura
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.diagnostic-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600
          output-artifact-directory: diagnostic-signed
          parameters: |
            version: "1.3.6"


      - name: Retain the test-signed binary for verification only
        if: inputs.mode == 'diagnostic-signing'
        uses: actions/upload-artifact@v7
        with:
          name: TEST-ONLY-signed-verifier-fixture
          path: diagnostic-signed/sakura.exe
          if-no-files-found: error
          retention-days: 7

  diagnostic-verification:
    if: inputs.mode == 'diagnostic-signing' && github.ref == 'refs/heads/feat/signpath-signing'
    needs: diagnostic-signing
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: TEST-ONLY-signed-verifier-fixture
          path: fixture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run focused signing unit tests
        shell: pwsh
        run: |
          python -m pip install pytest pyyaml cryptography
          python -m pytest tests/unit/test_windows_signing.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check valid signature, tampering rejection, wrong pin and trust cleanup
        shell: pwsh
        env:
          TEST_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_TEST_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = $env:TEST_CERTIFICATE_THUMBPRINT
          $root = "Cert:\CurrentUser\Root\$pin"
          $before = Test-Path -LiteralPath $root
          function Assert-Cleanup {
            if ((Test-Path -LiteralPath $root) -ne $before) { throw 'Test root trust was not restored' }
          }
          & ./tools/release/verify_windows_signature.ps1 -Path fixture/sakura.exe -TestCertificateThumbprint $pin
          Assert-Cleanup
          $wrongPinRejected = $false
          try { & ./tools/release/verify_windows_signature.ps1 -Path fixture/sakura.exe -TestCertificateThumbprint ('0' * 40) }
          catch { $wrongPinRejected = $true }
          if (-not $wrongPinRejected) { throw 'Wrong certificate pin was accepted' }
          Assert-Cleanup
          $runnerEnvironment = $env:RUNNER_ENVIRONMENT
          $nonHostedRejected = $false
          try {
            $env:RUNNER_ENVIRONMENT = 'self-hosted'
            try { & ./tools/release/verify_windows_signature.ps1 -Path fixture/sakura.exe -TestCertificateThumbprint $pin }
            catch { $nonHostedRejected = $true }
          } finally { $env:RUNNER_ENVIRONMENT = $runnerEnvironment }
          if (-not $nonHostedRejected) { throw 'Non-hosted runner was accepted' }
          Assert-Cleanup
          # Change a hashed .text section byte, not an excluded PE checksum/certificate byte.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path fixture/sakura.exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw 'Invalid PE fixture' }
          $count = [BitConverter]::ToUInt16($bytes, $pe + 6)
          $table = $pe + 24 + [BitConverter]::ToUInt16($bytes, $pe + 20)
          $changed = $false
          for ($i = 0; $i -lt $count; $i++) {
            $s = $table + 40 * $i
            $name = [Text.Encoding]::ASCII.GetString($bytes, $s, 8).Trim([char]0)
            if ($name -eq '.text') {
              $size = [BitConverter]::ToUInt32($bytes, $s + 16)
              $offset = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($size -eq 0 -or $offset -ge $bytes.Length) { throw 'Invalid .text section' }
              $bytes[$offset] = $bytes[$offset] -bxor 1
              $changed = $true
              break
            }
          }
          if (-not $changed) { throw 'No .text section to tamper' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'fixture/tampered.exe'), $bytes)
          $tamperRejected = $false
          try { & ./tools/release/verify_windows_signature.ps1 -Path fixture/tampered.exe -TestCertificateThumbprint $pin }
          catch { $tamperRejected = $true; Write-Host "Expected tamper rejection: $($_.Exception.Message)" }
          if (-not $tamperRejected) { throw 'Tampered PE was accepted' }
          Assert-Cleanup
          Write-Host 'PASS: valid signed PE; wrong pin rejected; tampered .text rejected; trust restored. No binary executed.'


  metadata:
    if: ${{ !startsWith(inputs.mode, 'diagnostic-') }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate the current version changelog
        if: inputs.mode == 'publish'
        run: python -m tools.release.release_notes --check
      - name: Validate VERSION and release-wide updater credentials
        id: metadata
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_TEST_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_TEST_CERTIFICATE_THUMBPRINT }}
          SAKURA_UPDATER_PUBLIC_KEY: ${{ secrets.SAKURA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(python tools/release/versioning.py)"
          test -n "$SIGNPATH_API_TOKEN" || { echo 'SIGNPATH_API_TOKEN is required.' >&2; exit 1; }
          if [[ "$MODE" == "publish" ]]; then
            test -n "$SAKURA_UPDATER_PUBLIC_KEY" || { echo 'SAKURA_UPDATER_PUBLIC_KEY is required.' >&2; exit 1; }
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required.' >&2; exit 1; }
            echo 'matrix={"include":[{"target":"windows-x64","runner":"windows-2025","archive":"python-runtime.zip"},{"target":"macos-arm64","runner":"macos-15","archive":"python-runtime.tar.gz"},{"target":"linux-x64","runner":"ubuntu-24.04","archive":"python-runtime.tar.gz"}]}' >> "$GITHUB_OUTPUT"
          else
            test -n "$SIGNPATH_TEST_CERTIFICATE_THUMBPRINT" || { echo 'SIGNPATH_TEST_CERTIFICATE_THUMBPRINT is required.' >&2; exit 1; }
            echo 'matrix={"include":[{"target":"windows-x64","runner":"windows-2025","archive":"python-runtime.zip"}]}' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 两轮正式签名分别留出人工审批时间。
    timeout-minutes: ${{ matrix.target == 'windows-x64' && 180 || 55 }}
    permissions:
      contents: read
      actions: read
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUTF8: "1"
      SAKURA_UPDATER_ENDPOINT: https://api.sakura.cialloo.cn/service/v1/latest.json
      SAKURA_UPDATER_PUBLIC_KEY: ${{ inputs.mode == 'publish' && secrets.SAKURA_UPDATER_PUBLIC_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.mode == 'publish' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.mode == 'publish' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      SIGNPATH_POLICY: ${{ inputs.mode == 'publish' && 'release-signing' || 'test-signing' }}
      SIGNPATH_TEST_CERTIFICATE_THUMBPRINT: ${{ inputs.mode == 'test-signing' && vars.SIGNPATH_TEST_CERTIFICATE_THUMBPRINT || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Prepare the updater signature verifier in the build Python
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/release/requirements.txt
          python tools/release/verify_updater_signature.py --help

      - name: Prepare an isolated updater key for test signing
        if: inputs.mode == 'test-signing'
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'test-updater.key'
          npx --yes @tauri-apps/cli@2.11.4 signer generate --ci --write-keys $keyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $key = (Get-Content -Raw $keyPath).Trim()
          Write-Output "::add-mask::$key"
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
          "SAKURA_UPDATER_PUBLIC_KEY=$((Get-Content -Raw "$keyPath.pub").Trim())" >> $env:GITHUB_ENV
          "SAKURA_UPDATER_ENDPOINT=https://example.invalid/sakura-test/latest.json" >> $env:GITHUB_ENV

      - name: Check the optional Apple signing and notarization credentials
        id: apple_signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          configured=0
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if (( configured == 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing credentials are not configured; building unsigned and unnotarized macOS artifacts."
          elif (( configured != ${#names[@]} )); then
            echo "All Apple signing and notarization credentials must be configured together." >&2
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && steps.apple_signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download and verify the frozen Python archive
        shell: bash
        run: >-
          python scripts/runtime_v2_archive.py
          --manifest desktop/src-tauri/runtime-layouts/${{ matrix.target }}/runtime-manifest.json
          --output "$RUNNER_TEMP/${{ matrix.archive }}"

      - name: Extract bundled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'python-runtime'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP '${{ matrix.archive }}') -DestinationPath $root

      - name: Install Linux WebKit build prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            build-essential clang libclang-dev file libssl-dev libasound2-dev libgbm-dev \
            libpipewire-0.3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf

      - name: Extract bundled Python (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-runtime"
          tar -xzf "$RUNNER_TEMP/${{ matrix.archive }}" -C "$RUNNER_TEMP/python-runtime" --strip-components=1

      - name: Install the hash-locked release dependencies
        shell: bash
        run: >-
          python -m tools.release.prepare_python_runtime
          --target ${{ matrix.target }}
          --python-root "$RUNNER_TEMP/python-runtime"
          --lock packaging/requirements-${{ matrix.target }}.lock

      - name: Assemble and smoke the immutable distribution
        shell: bash
        run: >-
          python tools/release/stage_distribution.py
          --target ${{ matrix.target }}
          --python-root "$RUNNER_TEMP/python-runtime"
          --output desktop/src-tauri/release-staging
          --smoke

      - name: Generate the signed updater overlay
        shell: bash
        run: >-
          python tools/release/tauri_release_config.py
          --target ${{ matrix.target }}
          --output desktop/src-tauri/tauri.release.json
          --updater

      - name: Build the Runtime v2 platform bundle
        working-directory: desktop/src-tauri
        shell: bash
        env:
          SAKURA_REQUIRE_DIAGNOSTIC_MAPPING: "1"
        run: |
          set -euo pipefail
          if [[ "${{ steps.apple_signing.outputs.enabled }}" != "true" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npx --yes @tauri-apps/cli@2.11.4 build --config tauri.release.json --no-bundle
          else
            npx --yes @tauri-apps/cli@2.11.4 build --config tauri.release.json
          fi

      - name: Upload the unsigned Windows application
        if: runner.os == 'Windows'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-app
          path: desktop/src-tauri/target/release/sakura.exe
          if-no-files-found: error

      - name: Sign the Windows application
        if: runner.os == 'Windows'
        id: sign-app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ toJSON(needs.metadata.outputs.version) }}

      - name: Verify the signed application and build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/release/verify_windows_signature.ps1 -Path signed-app/sakura.exe -TestCertificateThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
          Copy-Item signed-app/sakura.exe desktop/src-tauri/target/release/sakura.exe
          Push-Location desktop/src-tauri
          try {
            npx --yes @tauri-apps/cli@2.11.4 bundle --config tauri.release.json --no-sign
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Path unsigned-installer -Force | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe unsigned-installer/Sakura-setup.exe

      - name: Upload the unsigned Windows installer
        if: runner.os == 'Windows'
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: unsigned-installer/Sakura-setup.exe
          if-no-files-found: error

      - name: Sign the Windows installer
        if: runner.os == 'Windows'
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          parameters: |
            version: ${{ toJSON(needs.metadata.outputs.version) }}

      - name: Collect Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $artifacts = New-Item -ItemType Directory -Path artifacts -Force
          $installer = 'signed-installer/Sakura-setup.exe'
          ./tools/release/verify_windows_signature.ps1 -Path $installer -TestCertificateThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
          $setupOut = Join-Path $artifacts.FullName "Sakura-$env:VERSION-windows-x64-setup.exe"
          Copy-Item $installer $setupOut
          npx --yes @tauri-apps/cli@2.11.4 signer sign $setupOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/verify_updater_signature.py `
            $setupOut "$setupOut.sig"

      - name: Stage the Windows shell for the deferred Portable package
        if: runner.os == 'Windows' && inputs.mode == 'publish'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable-shell -Force | Out-Null
          Copy-Item desktop/src-tauri/target/release/sakura.exe portable-shell/sakura.exe

      - name: Collect Linux release artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          update="$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage.tar.gz' -print -quit)"
          deb="$(find desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "$appimage" || -z "$deb" || -z "$update" || ! -f "${update}.sig" ]]; then
            echo 'Linux bundle or updater signature was not produced.' >&2
            exit 1
          fi
          appimage_out="artifacts/Sakura-${VERSION}-linux-x64.AppImage"
          update_out="artifacts/Sakura-${VERSION}-linux-x64.AppImage.tar.gz"
          deb_out="artifacts/Sakura-${VERSION}-linux-x64.deb"
          cp "$appimage" "$appimage_out"
          cp "$deb" "$deb_out"
          cp "$update" "$update_out"
          cp "${update}.sig" "${update_out}.sig"
          python tools/release/verify_updater_signature.py \
            "$update_out" "${update_out}.sig"
          python tools/release/package_optional_plugin.py \
            --source plugins/optional/playwright_browser \
            --output "artifacts/Sakura-Playwright-${VERSION}.sakplugin.zip"

      - name: Collect macOS release artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODE_SIGNING_ENABLED: ${{ steps.apple_signing.outputs.enabled }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          update="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$app" && test -n "$dmg" && test -n "$update" && test -f "${update}.sig"
          app_zip="artifacts/Sakura-${VERSION}-macos-arm64.app.zip"
          dmg_out="artifacts/Sakura-${VERSION}-macos-arm64.dmg"
          update_out="artifacts/Sakura-${VERSION}-macos-arm64.app.tar.gz"
          help_source="packaging/macos-open-help.html"
          help_out="artifacts/Sakura-${VERSION}-macos-open-help.html"
          app_zip_root="$RUNNER_TEMP/sakura-macos-app-zip"
          mkdir -p "$app_zip_root"
          ditto "$app" "$app_zip_root/$(basename "$app")"
          cp "$help_source" "$app_zip_root/Sakura-macOS-open-help.html"
          ditto -c -k --sequesterRsrc "$app_zip_root" "$app_zip"
          cp "$help_source" "$help_out"
          cp "$dmg" "$dmg_out"
          cp "$update" "$update_out"
          cp "${update}.sig" "${update_out}.sig"
          python tools/release/verify_updater_signature.py \
            "$update_out" "${update_out}.sig"
          if [[ "$APPLE_CODE_SIGNING_ENABLED" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
          fi
          python tools/release/package_optional_plugin.py \
            --source plugins/optional/playwright_browser \
            --output "artifacts/Sakura-Playwright-${VERSION}.sakplugin.zip"

      - name: Retain diagnostic build mapping
        shell: bash
        run: |
          mkdir -p artifacts
          cp desktop/src-tauri/release-staging/diagnostic-build.json "artifacts/diagnostic-build-${{ matrix.target }}.json"

      - name: Record the Windows signing requests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_REQUEST: ${{ steps.sign-app.outputs.signing-request-web-url }}
          INSTALLER_REQUEST: ${{ steps.sign-installer.outputs.signing-request-web-url }}
        run: |
          "签名策略：$env:SIGNPATH_POLICY" >> $env:GITHUB_STEP_SUMMARY
          "程序签名：$env:APP_REQUEST" >> $env:GITHUB_STEP_SUMMARY
          "安装包签名：$env:INSTALLER_REQUEST" >> $env:GITHUB_STEP_SUMMARY
          if ($env:SIGNPATH_POLICY -eq 'test-signing') {
            Copy-Item signed-app/sakura.exe artifacts/sakura.exe
            "仅供测试，不用于公开发布或正式自动更新。" | Set-Content artifacts/TEST-ONLY.txt
            "本次仅上传测试产物。请将成功的签名请求和本次构建链接提供给 SignPath 审核。" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.mode == 'publish' && 'release' || 'TEST-ONLY' }}-${{ needs.metadata.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows shell for deferred Portable packaging
        if: runner.os == 'Windows' && inputs.mode == 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: portable-shell-${{ needs.metadata.outputs.tag }}-windows-x64
          path: portable-shell/sakura.exe
          if-no-files-found: error
          retention-days: 1

  portable:
    if: inputs.mode == 'publish'
    needs: [metadata, bundle]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download and verify the frozen Python archive
        shell: bash
        run: >-
          python scripts/runtime_v2_archive.py
          --manifest desktop/src-tauri/runtime-layouts/windows-x64/runtime-manifest.json
          --output "$RUNNER_TEMP/python-runtime.zip"
      - name: Extract bundled Python
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'python-runtime'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'python-runtime.zip') -DestinationPath $root
      - name: Install the hash-locked release dependencies
        shell: bash
        run: >-
          python -m tools.release.prepare_python_runtime
          --target windows-x64
          --python-root "$RUNNER_TEMP/python-runtime"
          --lock packaging/requirements-windows-x64.lock
      - name: Assemble and smoke the Portable distribution
        shell: pwsh
        run: |
          python tools/release/stage_distribution.py `
            --target windows-x64 `
            --python-root (Join-Path $env:RUNNER_TEMP 'python-runtime') `
            --output desktop/src-tauri/portable-staging `
            --portable `
            --smoke
      - name: Download the previously compiled Windows shell
        uses: actions/download-artifact@v4
        with:
          name: portable-shell-${{ needs.metadata.outputs.tag }}-windows-x64
          path: portable-shell
      - name: Collect the Portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          Copy-Item portable-shell/sakura.exe desktop/src-tauri/portable-staging/sakura.exe
          Remove-Item desktop/src-tauri/portable-staging/release-inventory.json
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $portable = "artifacts/Sakura-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path desktop/src-tauri/portable-staging/* -DestinationPath $portable
      - name: Upload the deferred Portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ needs.metadata.outputs.tag }}-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.mode == 'publish'
    needs: [metadata, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download signed release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.metadata.outputs.tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate the release body and version notes
        run: >-
          python -m tools.release.release_notes
          --repository "$GITHUB_REPOSITORY"
          --assets-dir release-assets
          --output release-body.md
          --notes-output release-notes.md
      - name: Generate the signed static updater manifest
        shell: bash
        env:
          RELEASE_REPOSITORY: Rvosy/Sakura
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python tools/release/updater_manifest.py \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}" \
            --output release-assets/latest.json \
            --release windows-x64 \
              "release-assets/Sakura-${VERSION}-windows-x64-setup.exe" \
              "release-assets/Sakura-${VERSION}-windows-x64-setup.exe.sig" \
            --release macos-arm64 \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz" \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz.sig" \
            --release linux-x64 \
              "release-assets/Sakura-${VERSION}-linux-x64.AppImage.tar.gz" \
              "release-assets/Sakura-${VERSION}-linux-x64.AppImage.tar.gz.sig"
      - name: Publish the formal GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          token: ${{ github.token }}
          files: release-assets/*

  publish-portable:
    needs: [metadata, publish, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download the signed installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.metadata.outputs.tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Download the deferred Portable artifact
        uses: actions/download-artifact@v4
        with:
          name: portable-${{ needs.metadata.outputs.tag }}-windows-x64
          path: release-assets
      - name: Regenerate the release body with the Portable download
        run: >-
          python -m tools.release.release_notes
          --repository "$GITHUB_REPOSITORY"
          --assets-dir release-assets
          --output release-body.md
          --notes-output release-notes.md
      - name: Regenerate the updater manifest with the Portable asset
        shell: bash
        env:
          RELEASE_REPOSITORY: Rvosy/Sakura
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python tools/release/updater_manifest.py \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}" \
            --output release-assets/latest.json \
            --portable "release-assets/Sakura-${VERSION}-windows-x64-portable.zip" \
            --release windows-x64 \
              "release-assets/Sakura-${VERSION}-windows-x64-setup.exe" \
              "release-assets/Sakura-${VERSION}-windows-x64-setup.exe.sig" \
            --release macos-arm64 \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz" \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz.sig" \
            --release linux-x64 \
              "release-assets/Sakura-${VERSION}-linux-x64.AppImage.tar.gz" \
              "release-assets/Sakura-${VERSION}-linux-x64.AppImage.tar.gz.sig"
      - name: Append the Portable ZIP and refresh the release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          token: ${{ github.token }}
          files: release-assets/Sakura-${{ needs.metadata.outputs.version }}-windows-x64-portable.zip
      - name: Publish the final updater manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          token: ${{ github.token }}
          files: release-assets/latest.json

  import-console-draft:
    name: Import release into private console
    needs: [metadata, publish-portable]
    if: needs.metadata.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare the console draft metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > service-github.json
          published_at="$(jq -r .published_at service-github.json)"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg publishedAt "$published_at" \
            '{
              schema: 1,
              latest: $version,
              minimumSupported: null,
              releaseUrl: ("https://github.com/Rvosy/Sakura/releases/tag/" + $tag),
              publishedAt: $publishedAt,
              urgent: false,
              downloads: {
                windowsX64Setup: ("https://github.com/Rvosy/Sakura/releases/download/" + $tag + "/Sakura-" + $version + "-windows-x64-setup.exe"),
                windowsX64Portable: ("https://github.com/Rvosy/Sakura/releases/download/" + $tag + "/Sakura-" + $version + "-windows-x64-portable.zip"),
                macosArm64Dmg: ("https://github.com/Rvosy/Sakura/releases/download/" + $tag + "/Sakura-" + $version + "-macos-arm64.dmg"),
                linuxX64AppImage: ("https://github.com/Rvosy/Sakura/releases/download/" + $tag + "/Sakura-" + $version + "-linux-x64.AppImage")
              },
              updaterManifestUrl: "https://github.com/Rvosy/Sakura/releases/latest/download/latest.json"
            }' > service-releases.json

      - name: Prepare the complete release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir service-updater
          python services/sakura/releases.py build \
            --release service-releases.json \
            --updater service-updater/latest.json \
            --output service-publication.json

      - name: Configure the restricted draft import identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SAKURA_SERVICE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAKURA_SERVICE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sakura-service
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sakura-service ~/.ssh/known_hosts

      - name: Import draft without publishing the public manifest
        shell: bash
        run: |
          set -euo pipefail
          ssh -T \
            -i ~/.ssh/sakura-service \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            sakura-release@sakura.cialloo.cn \
            < service-publication.json > console-draft.json
          jq -e '.id and .version and .state and .consoleUrl' console-draft.json >/dev/null
          {
            printf '### 版本草稿已导入\n\n'
            printf '版本：%s · 状态：%s\n\n' "$(jq -r .version console-draft.json)" "$(jq -r .state console-draft.json)"
            printf '[打开 Sakura 版本发布](https://adm.sakura.cialloo.cn/admin/#releases)\n\n'
            printf '请登录后台核对草稿并发布。本步骤未修改公开更新清单。\n'
          } >> "$GITHUB_STEP_SUMMARY"
