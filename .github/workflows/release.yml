name: Release Runtime v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate VERSION and release-wide updater credentials
        id: metadata
        shell: bash
        env:
          SAKURA_UPDATER_PUBLIC_KEY: ${{ secrets.SAKURA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(python tools/release/versioning.py)"
          test -n "$SAKURA_UPDATER_PUBLIC_KEY" || { echo 'SAKURA_UPDATER_PUBLIC_KEY is required.' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            archive: python-runtime.zip
          - target: macos-arm64
            runner: macos-15
            archive: python-runtime.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUTF8: "1"
      SAKURA_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      SAKURA_UPDATER_PUBLIC_KEY: ${{ secrets.SAKURA_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enforce Windows Authenticode release credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CERTIFICATE_BASE64 is required.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required.' }

      - name: Import the Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sakura-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows signing certificate import failed.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Enforce Apple codesign and notarization release credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "$name is required." >&2; exit 1; }
          done

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download and verify the frozen Python archive
        shell: bash
        run: >-
          python scripts/runtime_v2_archive.py
          --manifest desktop/src-tauri/runtime-layouts/${{ matrix.target }}/runtime-manifest.json
          --output "$RUNNER_TEMP/${{ matrix.archive }}"

      - name: Extract bundled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'python-runtime'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP '${{ matrix.archive }}') -DestinationPath $root

      - name: Extract bundled Python (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-runtime"
          tar -xzf "$RUNNER_TEMP/${{ matrix.archive }}" -C "$RUNNER_TEMP/python-runtime" --strip-components=1

      - name: Install the hash-locked release dependencies
        shell: bash
        run: >-
          python -m tools.release.prepare_python_runtime
          --target ${{ matrix.target }}
          --python-root "$RUNNER_TEMP/python-runtime"
          --lock packaging/requirements-${{ matrix.target }}.lock

      - name: Assemble and smoke the immutable distribution
        shell: bash
        run: >-
          python tools/release/stage_distribution.py
          --target ${{ matrix.target }}
          --python-root "$RUNNER_TEMP/python-runtime"
          --output desktop/src-tauri/release-staging
          --smoke

      - name: Generate the signed updater overlay
        shell: bash
        run: >-
          python tools/release/tauri_release_config.py
          --target ${{ matrix.target }}
          --output desktop/src-tauri/tauri.release.json
          --updater

      - name: Build, sign, and notarize the Runtime v2 platform bundle
        working-directory: desktop/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2.9.6 build --config tauri.release.json

      - name: Collect signed Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $artifacts = New-Item -ItemType Directory -Path artifacts -Force
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundle -Filter '*.exe' | Select-Object -First 1
          $update = Get-ChildItem $bundle -Filter '*.nsis.zip' | Select-Object -First 1
          if (-not $installer -or -not $update -or -not (Test-Path -LiteralPath "$($update.FullName).sig")) {
            throw 'Signed NSIS or updater artifacts were not produced.'
          }
          $setupOut = Join-Path $artifacts.FullName "Sakura-$env:VERSION-windows-x64-setup.exe"
          $updateOut = Join-Path $artifacts.FullName "Sakura-$env:VERSION-windows-x64.nsis.zip"
          Copy-Item $installer.FullName $setupOut
          Copy-Item $update.FullName $updateOut
          Copy-Item "$($update.FullName).sig" "$updateOut.sig"
          python tools/release/stage_distribution.py `
            --target windows-x64 `
            --python-root (Join-Path $env:RUNNER_TEMP 'python-runtime') `
            --output desktop/src-tauri/portable-staging `
            --portable `
            --smoke
          Copy-Item desktop/src-tauri/target/release/sakura-runtime-v2-shell.exe desktop/src-tauri/portable-staging/Sakura.exe
          $portable = Join-Path $artifacts.FullName "Sakura-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path desktop/src-tauri/portable-staging/* -DestinationPath $portable
          python tools/release/artifact_report.py `
            --inventory desktop/src-tauri/release-staging/release-inventory.json `
            --output artifacts/windows-x64-size-report.json `
            --installed-path desktop/src-tauri/portable-staging `
            --artifact $setupOut `
            --artifact $portable `
            --artifact $updateOut
          Copy-Item desktop/src-tauri/release-staging/release-inventory.json artifacts/windows-x64-inventory.json

      - name: Collect signed and notarized macOS release artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          update="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$app" && test -n "$dmg" && test -n "$update" && test -f "${update}.sig"
          app_zip="artifacts/Sakura-${VERSION}-macos-arm64.app.zip"
          dmg_out="artifacts/Sakura-${VERSION}-macos-arm64.dmg"
          update_out="artifacts/Sakura-${VERSION}-macos-arm64.app.tar.gz"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app_zip"
          cp "$dmg" "$dmg_out"
          cp "$update" "$update_out"
          cp "${update}.sig" "${update_out}.sig"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          python tools/release/artifact_report.py \
            --inventory desktop/src-tauri/release-staging/release-inventory.json \
            --output artifacts/macos-arm64-size-report.json \
            --installed-path "$app" \
            --artifact "$app_zip" \
            --artifact "$dmg_out" \
            --artifact "$update_out"
          cp desktop/src-tauri/release-staging/release-inventory.json artifacts/macos-arm64-inventory.json

      - name: Upload signed platform artifacts and evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.metadata.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [metadata, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download signed release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.metadata.outputs.tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate the signed static updater manifest
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python tools/release/updater_manifest.py \
            --version "$VERSION" \
            --base-url "https://github.com/${REPOSITORY}/releases/download/${TAG}" \
            --output release-assets/latest.json \
            --portable "release-assets/Sakura-${VERSION}-windows-x64-portable.zip" \
            --release windows-x64 \
              "release-assets/Sakura-${VERSION}-windows-x64.nsis.zip" \
              "release-assets/Sakura-${VERSION}-windows-x64.nsis.zip.sig" \
            --release macos-arm64 \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz" \
              "release-assets/Sakura-${VERSION}-macos-arm64.app.tar.gz.sig"
      - name: Publish the formal GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          files: release-assets/*
