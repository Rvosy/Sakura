name: Runtime v2 platform foundation

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/tauri-runtime-v2
    paths:
      - ".github/workflows/runtime-v2-platform-foundation.yml"
      - "desktop/rust-toolchain.toml"
      - "desktop/src-tauri/**"
      - "desktop/tests/**"
      - "app/**"
      - "legacy_qt_main.py"
      - "requirements*.txt"
      - "scripts/runtime_v2_archive.py"
      - "tests/fixtures/runtime_v2/**"
      - "tests/integration/test_core_host_*.py"
      - "tests/unit/test_core_host_*.py"
      - "tests/unit/test_runtime_v2_platform_workflow.py"
      - "tests/unit/test_wp_1a_04_shared_mutex.py"
      - "tests/unit/test_runtime_v2_archive.py"
      - "docs/runtime-v2/WP-1C-04-bundled-core-lifecycle.md"
      - "docs/adr/0002-runtime-v2-ipc.md"
      - "docs/superpowers/plans/2026-07-15-runtime-v2-work-packages.md"
  pull_request:
    paths:
      - ".github/workflows/runtime-v2-platform-foundation.yml"
      - "desktop/rust-toolchain.toml"
      - "desktop/src-tauri/**"
      - "desktop/tests/**"
      - "app/**"
      - "legacy_qt_main.py"
      - "requirements*.txt"
      - "scripts/runtime_v2_archive.py"
      - "tests/fixtures/runtime_v2/**"
      - "tests/integration/test_core_host_*.py"
      - "tests/unit/test_core_host_*.py"
      - "tests/unit/test_runtime_v2_platform_workflow.py"
      - "tests/unit/test_wp_1a_04_shared_mutex.py"
      - "tests/unit/test_runtime_v2_archive.py"
      - "docs/runtime-v2/WP-1C-04-bundled-core-lifecycle.md"
      - "docs/adr/0002-runtime-v2-ipc.md"
      - "docs/superpowers/plans/2026-07-15-runtime-v2-work-packages.md"

permissions:
  contents: read

concurrency:
  group: runtime-v2-platform-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-locator:
    name: RuntimeLocator (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            manifest: windows-x64
            archive: python-runtime.zip
          - platform: macos-arm64
            runner: macos-15
            manifest: macos-arm64
            archive: python-runtime.tar.gz
          - platform: linux-x64
            runner: ubuntu-24.04
            manifest: linux-x64
            archive: python-runtime.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Assert native runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "windows-x64 requires an AMD64 runner."
          }

      - name: Assert native runner architecture (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "${{ matrix.platform }}" in
            macos-arm64) test "$actual" = "arm64" ;;
            linux-x64) test "$actual" = "x86_64" ;;
            *) exit 2 ;;
          esac

      - name: Install Linux WebKit build prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo timeout --signal=TERM --kill-after=10s 45s dpkg --configure -a || true
            if sudo timeout --signal=TERM --kill-after=10s 45s \
                apt-get update -o Acquire::Retries=3 && \
              sudo timeout --signal=TERM --kill-after=10s 75s \
                apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                  build-essential file libssl-dev libwebkit2gtk-4.1-dev \
                  libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf xvfb; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Linux prerequisite installation attempt $attempt failed; retrying." >&2
              sleep $((attempt * 5))
            fi
          done
          echo "Linux prerequisite installation failed after 3 bounded attempts." >&2
          exit 1

      - name: Record fixed toolchain and native environment
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          rustup target list --installed
          python --version
          uname -a || true

      - name: Build the native Tauri Shell before guardian tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: desktop
        timeout-minutes: 8
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the native Tauri Shell before guardian tests (Linux bounded retry)
        if: runner.os == 'Linux'
        working-directory: desktop
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --signal=TERM --kill-after=10s 180s \
              cargo build --manifest-path src-tauri/Cargo.toml --locked; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Linux Cargo build attempt $attempt failed; retrying." >&2
              sleep $((attempt * 5))
            fi
          done
          echo "Linux Cargo build failed after 3 bounded attempts." >&2
          exit 1

      - name: Download and verify the pinned Python archive
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/runtime_v2_archive.py \
            --manifest "desktop/src-tauri/runtime-layouts/${{ matrix.manifest }}/runtime-manifest.json" \
            --output "$RUNNER_TEMP/${{ matrix.archive }}"

      - name: Stage exact Windows development Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'runtime'))
          $expected = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\runtime")
          if ($runtime -ne $expected) { throw "Unsafe Runtime staging target." }
          if (Test-Path -LiteralPath $runtime) {
            Remove-Item -LiteralPath $runtime -Recurse -Force
          }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\${{ matrix.archive }}" -DestinationPath $runtime

      - name: Stage exact macOS/Linux development Runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          test -n "$GITHUB_WORKSPACE"
          test "$runtime_dir" = "$GITHUB_WORKSPACE/runtime"
          rm -rf -- "$runtime_dir"
          mkdir -p -- "$runtime_dir"
          tar -xzf "$RUNNER_TEMP/${{ matrix.archive }}" -C "$runtime_dir" --strip-components=1

      - name: Install Runtime v2 Python dependencies
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/runtime"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install \
              --disable-pip-version-check \
              --no-compile \
              --no-deps \
              --only-binary=:all: \
              --platform win_amd64 \
              --python-version 3.12 \
              --target "$runtime_dir/Lib/site-packages" \
              --requirement requirements-runtime-v2.txt
            pth_file="$runtime_dir/python312._pth"
            test -f "$pth_file"
            if ! grep -Fqx 'Lib/site-packages' "$pth_file"; then
              printf '\nLib/site-packages\n' >> "$pth_file"
            fi
            "$runtime_dir/python.exe" -I -B -X utf8 -c 'import yaml'
          else
            "$runtime_dir/bin/python3" -m pip install \
              --disable-pip-version-check \
              --no-compile \
              --no-deps \
              --requirement requirements-runtime-v2.txt
            "$runtime_dir/bin/python3" -I -B -X utf8 -c 'import yaml'
          fi

      - name: Stage the frozen packaged Runtime and Core resource layout
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python desktop/tests/stage_wp_1c_04_bundled_runtime.py \
            --repo "$GITHUB_WORKSPACE" \
            --target "${{ matrix.platform }}" \
            --development-runtime "$GITHUB_WORKSPACE/runtime" \
            --resources "$RUNNER_TEMP/sakura-wp-1c-04-packaged-resources"

      - name: Check formatting
        working-directory: desktop
        timeout-minutes: 3
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run platform contract and golden layout tests
        working-directory: desktop
        timeout-minutes: 4
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked platform:: -- --test-threads=1

      - name: Run native shared instance lock tests
        working-directory: desktop
        timeout-minutes: 4
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked shared_instance::

      - name: Run native managed process tree backend tests
        if: runner.os != 'Windows'
        working-directory: desktop
        timeout-minutes: 4
        shell: bash
        env:
          SAKURA_RUNTIME_V2_TEST_PYTHON: ${{ github.workspace }}/runtime/bin/python3
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          platform::process_tree_backend::tests::posix_
          -- --nocapture

      - name: Run Linux Xvfb window backend contract tests
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          timeout --signal=TERM --kill-after=10s 90s
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24'
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          platform::window_backend:: -- --nocapture

      - name: Run Windows Core lifecycle contracts
        if: runner.os == 'Windows'
        working-directory: desktop
        timeout-minutes: 4
        shell: pwsh
        env:
          RUST_BACKTRACE: '1'
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          core_host_runtime::tests:: -- --nocapture --test-threads=1

      - name: Run POSIX Core lifecycle contracts
        if: runner.os != 'Windows'
        working-directory: desktop
        timeout-minutes: 4
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          python3 - <<'PY'
          import subprocess
          raise SystemExit(subprocess.run([
              "cargo", "test", "--manifest-path", "src-tauri/Cargo.toml",
              "--locked", "core_host_runtime::tests::", "--", "--nocapture",
              "--test-threads=1",
          ], timeout=180).returncode)
          PY

      - name: Run packaged bundled Python lifecycle and fault matrix
        working-directory: desktop
        timeout-minutes: 4
        env:
          RUST_BACKTRACE: '1'
          SAKURA_WP_1C_04_PACKAGED_RESOURCES: ${{ runner.temp }}/sakura-wp-1c-04-packaged-resources
        run: >-
          python tests/run_wp_1c_04_packaged_lifecycle.py
          --resources "${{ runner.temp }}/sakura-wp-1c-04-packaged-resources"

      - name: Run native Windows Shell + development bundled Python Core lifecycle
        if: runner.os == 'Windows'
        working-directory: desktop
        timeout-minutes: 5
        shell: pwsh
        run: >-
          python tests/cross_platform_shell_core_lifecycle.py
          --binary src-tauri/target/debug/sakura-runtime-v2-shell.exe
          --repo ..

      - name: Run native macOS Shell + development bundled Python Core lifecycle
        if: runner.os == 'macOS'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        run: >-
          python3 tests/cross_platform_shell_core_lifecycle.py
          --binary src-tauri/target/debug/sakura-runtime-v2-shell
          --repo ..

      - name: Run native Linux Xvfb Shell + development bundled Python Core lifecycle
        if: runner.os == 'Linux'
        working-directory: desktop
        timeout-minutes: 5
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          timeout --signal=TERM --kill-after=10s 240s
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24'
          python3 tests/cross_platform_shell_core_lifecycle.py
          --binary src-tauri/target/debug/sakura-runtime-v2-shell
          --repo ..

      - name: Verify the staged native Runtime through RuntimeLocator
        working-directory: desktop
        timeout-minutes: 4
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          platform::runtime_locator::tests::staged_repository_runtime_is_an_explicit_development_layout
          -- --ignored --exact
