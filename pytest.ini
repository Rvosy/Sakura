[pytest]
testpaths = tests
addopts = -p no:cacheprovider --basetemp=.pytest-basetemp
timeout = 60
timeout_method = thread
filterwarnings =
    ignore:SOCKS support in urllib3 requires.*
env =
    PYTHONIOENCODING=utf-8
markers =
    unit: fast unit tests
    integration: integration tests
    slow: slow tests
    requires_llm: tests requiring real LLM/API access
    requires_network: tests requiring network access
    requires_playwright: tests requiring Playwright/browser
