server {
    listen 443 ssl http2;
    server_name adm.sakura.cialloo.cn;
    ssl_certificate /etc/letsencrypt/live/sakura-console/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakura-console/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    location = / { return 302 /admin/; }
    include /www/server/panel/vhost/nginx/snippets/sakura-admin-locations.conf;
    location / { return 404; }
}
