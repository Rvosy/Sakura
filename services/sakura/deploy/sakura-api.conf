limit_req_zone $binary_remote_addr zone=sakura_ingest:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name api.sakura.cialloo.cn;
    ssl_certificate /etc/letsencrypt/live/sakura-console/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakura-console/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/Sakura;
    access_log off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    include /www/server/panel/vhost/nginx/snippets/sakura-service-location.conf;
    location ~ ^/(v[12]/(errors|events|model-calls)|v3/errors)$ {
        limit_except POST { deny all; }
        limit_req zone=sakura_ingest burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
