api: 4
id: sakura.tts.genie
name: Genie 语音合成
author: Rvosy
description: 使用 Genie 合成角色语音。
version: 0.1.0
entry: plugin:GeniePlugin
# 保留老用户未显式保存的启用状态；新用户由 Shell 的 new_user_plugins.yaml 初始化为关闭。
enabled: true
priority: 120
provides:
  - sakura.tts.provider.genie
requires:
  - sakura.tts
  - sakura.host.artifacts
  - sakura.host.character
  - sakura.host.diagnostics
  - sakura.host.settings
  - sakura.host.settings.surface-v0
presentation:
  kind: provider
  category: voice
  icon: audio-lines

# 可读取或转换的角色语音资源格式；不表示服务已启动。
ttsResources:
  - gpt-sovits.models@1
  - genie.onnx@1
