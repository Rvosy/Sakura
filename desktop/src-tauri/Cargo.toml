[package]
name = "sakura-runtime-v2-shell"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
tauri = { version = "=2.11.3", features = ["image-png", "macos-private-api", "tray-icon"] }
png = "=0.18.1"
rfd = "=0.15.4"
time = { version = "=0.3.53", features = ["local-offset", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation_Numerics", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WinRT_Composition", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "=0.2.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["block2", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "=0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "=0.18.5"
gdk = "=0.18.2"
gtk = "=0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
interaction-latency-diagnostics = []
