[package]
name = "sakura-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
xcap = "0.9.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
