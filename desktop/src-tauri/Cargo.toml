[package]
name = "sakura"
version = "1.0.5"
authors = ["Rvosy"]
edition = "2021"
publish = false
build = "build.rs"
autobins = false
default-run = "sakura"

[[bin]]
name = "sakura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
tauri = { version = "=2.11.3", features = ["image-png", "macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.10.1"
# The updater disables reqwest's default features, so explicitly unify this
# feature back in to honor Windows/macOS system proxy settings as well as the
# standard HTTP(S)_PROXY environment variables.
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "system-proxy"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "time"] }
png = "=0.18.1"
rfd = "=0.15.4"
time = { version = "=0.3.53", features = ["formatting", "local-offset", "parsing"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
uuid = { version = "=1.23.5", features = ["v4"] }
xcap = "=0.9.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation_Numerics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Effects", "System", "System_Power", "UI_Composition", "UI_Composition_Desktop", "UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Graphics_Direct2D", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows-collections = "=0.2.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
windows-version = "=0.1.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["block2", "NSAnimation", "NSAnimationContext", "NSEvent", "NSColor", "NSControl", "NSGlassEffectView", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = "=0.3.2"
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "=0.18.5"
gdk = "=0.18.2"
gtk = "=0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
interaction-latency-diagnostics = []
