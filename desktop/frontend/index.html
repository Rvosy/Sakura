<!doctype html>
<html lang="zh-CN" data-theme="character">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sakura Runtime v2</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body data-shell-state="loading" data-chat-state="ready">
    <main id="pet-stage" class="pet-stage" aria-label="Sakura 桌宠">
      <section id="chat-bubble" class="bubble" data-drag-region="true" aria-label="角色回复">
        <header class="bubble-header">
          <div class="identity">
            <strong id="character-name">Sakura</strong>
            <span id="chat-phase" class="visually-hidden" role="status">正在准备</span>
          </div>
          <div class="bubble-actions" data-interactive="true">
            <button type="button" id="typewriter-skip" class="text-action" hidden>立即显示</button>
            <button type="button" id="close-window" class="close-action" aria-label="关闭 Sakura">×</button>
          </div>
        </header>
        <div id="bubble-copy" class="bubble-copy" data-interactive="true" tabindex="0" aria-live="polite">
          正在读取当前角色……
        </div>
        <p id="presentation-error" class="presentation-error" role="status" hidden></p>
      </section>

      <form id="composer" class="composer" data-interactive="true" aria-label="聊天输入">
        <textarea
          id="composer-input"
          rows="1"
          maxlength="4096"
          lang="zh-CN"
          aria-label="发送给当前角色的消息"
          placeholder="和当前角色说点什么……"
        ></textarea>
        <button type="submit" id="composer-send">发送</button>
      </form>

      <figure id="portrait" class="portrait" data-drag-region="true" aria-label="当前角色立绘，可拖动窗口">
        <div class="portrait-frame">
          <img id="portrait-current" class="portrait-image portrait-image--current" alt="" />
          <img id="portrait-next" class="portrait-image portrait-image--next" alt="" aria-hidden="true" />
          <div id="portrait-fallback" class="portrait-fallback" hidden>
            <strong id="portrait-fallback-name">Sakura</strong>
            <span>立绘暂时无法显示</span>
          </div>
        </div>
      </figure>

      <section id="acceptance-entry" class="acceptance-entry" data-interactive="true" hidden aria-hidden="true">
        <button type="button" data-scenario="普通消息">normal</button>
        <button type="button" data-scenario="/slow">slow</button>
        <button type="button" data-scenario="/error">error</button>
        <button type="button" data-scenario="/long">long</button>
        <button type="button" data-scenario="/multi">multi</button>
        <button type="button" data-scenario="/restart">restart</button>
      </section>
    </main>
  </body>
</html>
