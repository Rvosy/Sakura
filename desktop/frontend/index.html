<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sakura Runtime v2 · Pet interaction gate</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body data-shell-state="pet-geometry-loading">
    <main id="pet-stage" class="pet-stage" aria-label="透明桌宠窗口交互技术门">
      <section id="lifecycle-panel" class="lifecycle-panel" data-interactive="true" aria-live="polite">
        <div>
          <span id="lifecycle-label" class="lifecycle-label">startup</span>
          <strong id="lifecycle-headline">Sakura 正在启动</strong>
        </div>
        <dl class="lifecycle-diagnostics" aria-label="脱敏生命周期诊断">
          <div><dt>Code</dt><dd id="lifecycle-code">SHELL_STARTUP</dd></div>
          <div><dt>Desktop / Core</dt><dd id="lifecycle-versions">0.1.0 / unavailable</dd></div>
          <div><dt>Protocol</dt><dd id="lifecycle-protocol">2.1</dd></div>
          <div><dt>Logs</dt><dd id="lifecycle-logs">Sakura application logs</dd></div>
        </dl>
        <div class="lifecycle-actions">
          <button type="button" id="lifecycle-retry" disabled>Retry</button>
          <button type="button" id="lifecycle-exit">Exit</button>
        </div>
      </section>

      <section class="bubble" data-drag-region="true" aria-live="polite" aria-label="气泡正文，可拖动窗口">
        <span class="bubble-kicker">Interaction gate</span>
        <p id="bubble-copy">
          这是一段只用于边界验证的占位内容。无论文字多长，原生窗口都由布局契约限定。
        </p>
      </section>

      <div class="composer" data-interactive="true" aria-label="输入与中文输入法技术门">
        <textarea
          id="composer-input"
          rows="1"
          maxlength="4096"
          aria-label="技术门文本输入"
          placeholder="输入英文或中文…"
        ></textarea>
        <button type="button" id="composer-send" aria-label="本地发送技术反馈">发送</button>
      </div>

      <figure class="portrait" data-drag-region="true" aria-label="占位立绘，可拖动窗口">
        <div class="portrait-paper">
          <span class="sakura-mark" aria-hidden="true">✦</span>
          <div class="portrait-face" aria-hidden="true"></div>
          <div class="portrait-collar" aria-hidden="true"></div>
          <figcaption>SAKURA / PLACEHOLDER</figcaption>
        </div>
      </figure>

      <nav class="state-rail" data-interactive="true" aria-label="表现状态技术门">
        <button type="button" data-state="idle" aria-label="切换 idle 状态">I</button>
        <button type="button" data-state="bubble" aria-label="切换 bubble 状态">B</button>
        <button type="button" data-state="composer" aria-label="切换 composer 状态">C</button>
        <button type="button" data-state="expanded" aria-label="切换 expanded 状态">E</button>
        <button type="button" id="visibility-probe" aria-label="验证隐藏和显示">V</button>
        <button type="button" id="close-window" aria-label="关闭技术门窗口">×</button>
      </nav>

      <output id="geometry-readout" class="geometry-readout" aria-live="polite">initializing</output>
    </main>
  </body>
</html>
