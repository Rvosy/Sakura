<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakura Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="pet-stage" class="pet-stage" aria-label="Sakura 桌宠主窗口">
      <section class="status-ribbon" data-drag-region data-tauri-drag-region aria-live="polite">
        <span class="status-ribbon__mark" aria-hidden="true">桜</span>
        <span id="desktop-status">正在初始化 Brain Host</span>
      </section>

      <section
        id="portrait-stage"
        class="portrait-stage"
        data-drag-region
        data-tauri-drag-region
        aria-label="角色立绘"
      >
        <img id="portrait-current" class="portrait-image" alt="" draggable="false" />
        <img
          id="portrait-transition"
          class="portrait-image portrait-image--transition"
          alt=""
          draggable="false"
        />
        <div id="portrait-fallback" class="portrait-fallback" aria-hidden="true">
          <span>• ᴗ •</span>
        </div>
      </section>

      <section id="speech-bubble" class="speech-card" aria-live="polite">
        <span id="character-name" class="character-name">Sakura</span>
        <p id="subtitle-text" class="subtitle-text">正在连接角色服务……</p>
      </section>

      <section id="tool-confirmation" class="tool-confirmation" aria-label="工具操作确认" hidden>
        <div class="tool-confirmation__copy">
          <strong id="tool-confirmation-name"></strong>
          <span id="tool-confirmation-reason"></span>
        </div>
        <pre id="tool-confirmation-arguments" class="tool-confirmation__arguments"></pre>
        <div class="tool-confirmation__actions">
          <button id="reject-tool-action" type="button">拒绝</button>
          <button id="confirm-tool-action" class="primary-button" type="button">确认</button>
        </div>
      </section>

      <section id="input-card" class="input-card" aria-label="发送消息">
        <button id="capture-screen" class="icon-button" type="button" aria-label="截图">截</button>
        <label class="composer" for="message-input">
          <span class="sr-only">消息</span>
          <input
            id="message-input"
            name="message"
            type="text"
            autocomplete="off"
            placeholder="输入消息…"
          />
        </label>
        <button id="send-message" class="primary-button" type="button">发送</button>
        <button id="cancel-message" class="primary-button" type="button" hidden>取消</button>
      </section>

      <details class="prototype-tools">
        <summary aria-label="技术验证工具">···</summary>
        <div class="prototype-actions" aria-label="原生能力原型">
          <button id="audio-prototype" type="button">试听提示音</button>
          <button id="capture-prototype" type="button">验证截图</button>
          <button id="click-through-toggle" type="button" aria-pressed="false">鼠标穿透</button>
          <button id="hide-pet" type="button">隐藏</button>
        </div>
        <span id="prototype-result" aria-live="polite">桌面能力已就绪。</span>
      </details>
    </main>
  </body>
</html>
